<style>:root{--bg:#0b0d12;--panel:#171b23;--accent:#00ffcc;--text:#fff;--muted:#aeb6c3}*{box-sizing:border-box}body{font-family:system-ui,sans-serif;background:radial-gradient(circle at 50% 0,#183044 0,#0b0d12 42%);color:var(--text);margin:0;padding:22px;min-height:100vh}header{text-align:center;max-width:900px;margin:24px auto 30px}header h1{margin:0 0 8px;font-size:clamp(2rem,7vw,4.2rem);letter-spacing:-.04em;color:var(--accent);text-shadow:0 0 28px rgba(0,255,204,.22)}header p{color:var(--muted);font-size:1.05rem}.cta{display:inline-block;margin-top:16px;padding:11px 17px;border:1px solid #2e665f;border-radius:999px;color:#dffff8;background:#102b2a}.container{display:flex;flex-direction:column;width:100%;max-width:1100px;margin:auto;gap:25px}@media(min-width:768px){.container{flex-direction:row}}.jukebox-panel,.playlist-panel{background:rgba(23,27,35,.92);border:1px solid #29323f;border-radius:20px;padding:25px;box-shadow:0 18px 55px rgba(0,0,0,.45)}.jukebox-panel{flex:1;height:fit-content;position:sticky;top:20px}.playlist-panel{flex:1.4;max-height:700px;overflow-y:auto}.video-container{width:100%;padding-bottom:56.25%;position:relative;background:#000;border-radius:14px;overflow:hidden;border:2px solid #333}.video-container iframe,#player{position:absolute;inset:0;width:100%;height:100%}.now-playing{text-align:center;background:#0c1118;padding:20px;border-radius:12px;border-top:3px solid var(--accent);margin-top:18px}.now-playing h3{margin:7px 0}.now-playing p{color:var(--accent);margin:0}.track-list{list-style:none;padding:0;margin:0}.track-item{display:flex;align-items:center;padding:14px 16px;border-bottom:1px solid #2a303a;cursor:pointer;border-radius:9px;margin-bottom:6px;transition:.2s}.track-item:hover{background:#252c36;transform:translateX(4px)}.track-item.active{background:rgba(0,255,204,.1);border:1px solid var(--accent)}.track-index{font-weight:800;color:var(--accent);width:45px}.track-info{flex:1}.track-title{font-weight:650}.track-album{font-size: <script>const tracks=[{title:"Been Caught Stealing",artist:"Jane's Addiction",album:"Ritual de lo Habitual",ytId:"Dx3YVwNre8E"},{title:"Here's Where the Story Ends",artist:"The Sundays",album:"Reading, Writing and Arithmetic",ytId:"FHSIZ6S7Gis"},{title:"Dig For Fire",artist:"Pixies",album:"Bossanova",ytId:"v3Z82mOThpE"},{title:"Ball and Chain",artist:"Social Distortion",album:"Social Distortion",ytId:"_NWjehpG60E"},{title:"Merry Go Round",artist:"The Replacements",album:"All Shook Down",ytId:"tO0c7e8yN-E"},{title:"Soon",artist:"My Bloody Valentine",album:"Glider EP",ytId:"dBvN9XU9v_U"},{title:"The Only One I Know",artist:"The Charlatans",album:"Some Friendly",ytId:"0RJwW77Lsj8"},{title:"Step On",artist:"Happy Mondays",album:"Pills 'n' Thrills and Bellyaches",ytId:"6M0IdXIn6S8"},{title:"Birdhouse in Your Soul",artist:"They Might Be Giants",album:"Flood",ytId:"Nhj3Z9kJ694"},{title:"Enjoy the Silence",artist:"Depeche Mode",album:"Violator",ytId:"aGSKrC7dGcY"},{title:"Kool Thing",artist:"Sonic Youth",album:"Goo",ytId:"SDTSVrBh6g4"},{title:"Hard to Handle",artist:"The Black Crowes",album:"Shake Your Money Maker",ytId:"BRcs_OzQB14"},{title:"Epic",artist:"Faith No More",album:"The Real Thing",ytId:"ERGqOhE8YS0"},{title:"Stop!",artist:"Jane's Addiction",album:"Ritual de lo Habitual",ytId:"84pI6oXm8kw"},{title:"Velouria",artist:"Pixies",album:"Bossanova",ytId:"tPxGAB0a0bM"},{title:"I've Been Waiting",artist:"Matthew Sweet",album:"Girlfriend",ytId:"fx9b_Y7D9R4"},{title:"The Ship Song",artist:"Nick Cave & The Bad Seeds",album:"The Good Son",ytId:"T0spdc_gMfQ"},{title:"One Love",artist:"The Stone Roses",album:"One Love Single",ytId:"v8Lia_6A904"},{title:"Clipped",artist:"Bob Mould / Sugar",album:"Workbook Era",ytId:"p5b9hFas3a8"},{title:"All I Want",artist:"The Lightning Seeds",album:"Cloudcuckooland",ytId:"6gI_WnCmsdI"},{title:"Never Enough",artist:"The Cure",album:"Mixed Up",ytId:"mC6UasVAnZg"},{title:"Groove Is in the Heart",artist:"Deee-Lite",album:"World Clique",ytId:"etviGf1uWlg"},{title:"I'll Be Your Chauffeur",artist:"David J",album:"Songs from another Room",ytId:"vI84kOqN0cQ"},{title:"Overtime",artist:"The Wolfgang Press",album:"Bird Wood Cage",ytId:"1Zl7Y54nQrc"},{title:"Twister",artist:"Ultra Vivid Scene",album:"Joy 1967-1990",ytId:"m8E_yWJqNis"}];let player;const list=document.getElementById('track-list'),title=document.getElementById('current-title'),album=document.getElementById('current-album');function populateList(){tracks.forEach((t,i)=>{const li=document.createElement('li');li.className='track-item';li.innerHTML=`<div class="track-index">${String(i+1).padStart(2,'0')}</div><div class="track-info"><div class="track-title">${t.artist} - ${t.title}</div><div class="track-album">${t.album}</div></div>`;li.onclick=()=>playSelectedTrack(i);list.appendChild(li)})}const tag=document.createElement('script');tag.src='https://www.youtube.com/iframe_api';document.scripts[0].parentNode.insertBefore(tag,document.scripts[0]);function onYouTubeIframeAPIReady(){populateList();player=new YT.Player('player',{height:'100%',width:'100%',videoId:tracks[0].ytId,playerVars:{playsinline:1,modestbranding:1,rel:0,origin:location.origin},events:{onStateChange:cycle}});refresh(0)}function playSelectedTrack(i){player.loadVideoById(tracks[i].ytId);refresh(i)}function refresh(i){document.querySelectorAll('.track-item').forEach((x,j)=>x.classList.toggle('active',j===i));title.textContent=`${tracks[i].artist} — ${tracks[i].title}`;album.textContent=`${tracks[i].album} (1990)`.toUpperCase()}function cycle(e){if(e.data===YT.PlayerState.ENDED){const i=tracks.findIndex(t=>t.ytId===player.getVideoData().video_id);playSelectedTrack((i+1)%tracks.length)}}</script>
